<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UDEC PGC — Configurar fechas</title>
<link rel="icon" type="image/png" href="assets/logos/ESCUDO BLANCO.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="css/global.css">
</head>
<body>

  <div id="topbar"></div>

  <div class="app-shell">
    <div id="sidebar"></div>

    <main class="main-content">
      <div class="page-head mb-4">
        <h1 style="font-size:clamp(1.4rem,3vw,1.9rem);font-weight:800;color:var(--verde-medio);">Configurar fechas</h1>
        <p class="text-muted">Define el rango de cada etapa (Radicación, Registro PGC, Sustentación y Calificación) en los ciclos que tienes a cargo.</p>
      </div>

      <div id="banner" class="banner hidden"></div>

      <div class="table-responsive mb-4">
        <table class="table align-middle bg-white">
          <thead>
            <tr>
              <th scope="col">Ciclo</th>
              <th scope="col">Etapa</th>
              <th scope="col">Fechas</th>
              <th scope="col"><span class="visually-hidden">Acciones</span></th>
            </tr>
          </thead>
          <tbody id="tabla-fechas"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="footer"></div>

  <!-- Modal de edición de una etapa -->
  <div class="modal fade" id="modal-fechas" tabindex="-1" aria-labelledby="fechas-titulo" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="fechas-titulo">Configurar fechas</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="banner-modal-fechas" class="banner hidden"></div>
          <div class="row g-2">
            <div class="col-6">
              <label for="input-fecha-inicio" class="form-label">Inicio</label>
              <input type="date" class="form-control" id="input-fecha-inicio">
            </div>
            <div class="col-6">
              <label for="input-fecha-fin" class="form-label">Fin</label>
              <input type="date" class="form-control" id="input-fecha-fin">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="btn-guardar-fechas">Guardar cambios</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="components/navbar.js"></script>
  <script src="components/sidebar.js"></script>
  <script src="components/footer.js"></script>
  <script src="js/configurarFecha.js"></script>
  <script>
    requerirCapacidad("encargado");
    renderizarBarraSuperior("topbar");
    renderizarBarraLateral("sidebar", "configurarFecha").catch(console.error);
    renderizarPiePagina("footer");
    inicializarConfigurarFecha().catch(console.error);
  </script>
</body>
</html>
