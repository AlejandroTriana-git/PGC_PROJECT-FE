<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UDEC PGC — Configurar fechas</title>
<link rel="icon" type="image/png" href="assets/logos/ESCUDO BLANCO.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
</head>
<body>

  <div id="topbar"></div>

  <div class="app-shell">
    <div id="sidebar"></div>

    <main class="main-content">
      <div class="page-head mb-4">
        <h1 style="font-size:clamp(1.4rem,3vw,1.9rem);font-weight:800;color:var(--verde-medio);">Configurar fechas</h1>
        <p class="text-muted">Define el rango habilitado para Radicación y Registro PGC en tus ciclos a cargo.</p>
      </div>

      <div id="banner" class="banner hidden"></div>

      <div class="table-responsive mb-4">
        <table class="table align-middle bg-white">
          <thead>
            <tr>
              <th>Ciclo</th>
              <th>Radicación</th>
              <th>Registro PGC</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tabla-fechas"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="footer"></div>

  <!-- Modal de edición de fechas -->
  <div class="modal fade" id="modal-fechas" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="fechas-titulo"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted" style="font-size:.8rem;">Radicación de propuestas</p>
          <div class="row g-2 mb-3">
            <div class="col-6">
              <label for="input-inicio-radicacion" class="form-label">Inicio</label>
              <input type="date" class="form-control" id="input-inicio-radicacion">
            </div>
            <div class="col-6">
              <label for="input-fin-radicacion" class="form-label">Fin</label>
              <input type="date" class="form-control" id="input-fin-radicacion">
            </div>
          </div>

          <p class="text-muted" style="font-size:.8rem;">Registro de PGC</p>
          <div class="row g-2">
            <div class="col-6">
              <label for="input-inicio-registro" class="form-label">Inicio</label>
              <input type="date" class="form-control" id="input-inicio-registro">
            </div>
            <div class="col-6">
              <label for="input-fin-registro" class="form-label">Fin</label>
              <input type="date" class="form-control" id="input-fin-registro">
            </div>
          </div>

          <div id="banner-modal-fechas" class="banner hidden" style="margin-top:1rem;"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="btn-guardar-fechas">Guardar cambios</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="components/navbar.js"></script>
  <script src="components/sidebar.js"></script>
  <script src="components/footer.js"></script>
  <script src="js/configurarFecha.js"></script>
  <script>
    requerirCapacidad("encargado");
    renderizarBarraSuperior("topbar");
    renderizarBarraLateral("sidebar", "configurarFecha");
    renderizarPiePagina("footer");
    inicializarConfigurarFecha();
  </script>
</body>
</html>
