<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UDEC PGC — Radicar propuesta</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<link rel="icon" type="image/png" href="assets/logos/ESCUDO BLANCO.png">
</head>
<body>

  <div id="topbar"></div>

  <div class="app-shell">
    <div id="sidebar"></div>

    <main class="main-content">
      <div class="page-head mb-4">
        <h1 style="font-size:clamp(1.4rem,3vw,1.9rem);font-weight:800;color:var(--verde-medio);">Radicar propuesta</h1>
        <p class="text-muted">Diligencia los datos de tu Proyecto de Grado (PGC). Quedará en estado "Pendiente de validación".</p>
      </div>

      <div id="banner" class="banner hidden"></div>

      <form id="form-propuesta" class="row g-3" style="max-width: 760px;" novalidate>

        <div class="col-12">
          <label for="titulo" class="form-label">Título del proyecto</label>
          <input type="text" class="form-control" id="titulo">
        </div>

        <div class="col-12">
          <label for="categoria" class="form-label">Tipo de proyecto / Categoría</label>
          <select class="form-select" id="categoria">
            <option value="" selected disabled>Selecciona una opción</option>
            <option value="investigacion">Investigación</option>
            <option value="desarrollo">Desarrollo tecnológico</option>
            <option value="social">Proyección social</option>
            <option value="emprendimiento">Emprendimiento</option>
          </select>
        </div>

        <div class="col-12">
          <label for="problema" class="form-label">Problema</label>
          <textarea class="form-control" id="problema" rows="3"></textarea>
        </div>

        <div class="col-12">
          <label for="justificacion" class="form-label">Justificación</label>
          <textarea class="form-control" id="justificacion" rows="3"></textarea>
        </div>

        <div class="col-12">
          <label for="objetivos" class="form-label">Objetivos</label>
          <textarea class="form-control" id="objetivos" rows="3"></textarea>
        </div>

        <div class="col-12">
          <label for="solucion" class="form-label">Solución propuesta</label>
          <textarea class="form-control" id="solucion" rows="3"></textarea>
        </div>

        <div class="col-12">
          <label class="form-label">Integrantes</label>
          <div id="lista-integrantes" class="border rounded p-3"></div>
          <div class="form-text">Solo se muestran estudiantes de tu mismo ciclo.</div>
        </div>

        <div class="col-12">
          <label for="pdf" class="form-label">Documento PDF</label>
          <input type="file" class="form-control" id="pdf" accept="application/pdf">
          <div class="form-text">Solo archivos .pdf, máximo 10 MB.</div>
        </div>

        <div class="col-12">
          <button type="submit" class="btn btn-primary" id="btn-radicar">Radicar propuesta</button>
        </div>

      </form>
    </main>
  </div>

  <div id="footer"></div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="components/navbar.js"></script>
  <script src="components/sidebar.js"></script>
  <script src="components/footer.js"></script>
  <script src="js/radicar-propuesta.js"></script>
  <script>
    requerirRol("estudiante");
    renderizarBarraSuperior("topbar");
    renderizarBarraLateral("sidebar", "radicar-propuesta");
    renderizarPiePagina("footer");
    inicializarRadicarPropuesta();
  </script>
</body>
</html>
