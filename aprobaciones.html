<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UDEC PGC — Aprobaciones</title>
<link rel="icon" type="image/png" href="assets/logos/ESCUDO BLANCO.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
</head>
<body>

  <div id="topbar"></div>

  <div class="app-shell">
    <div id="sidebar"></div>

    <main class="main-content">
      <div class="page-head mb-4">
        <h1 style="font-size:clamp(1.4rem,3vw,1.9rem);font-weight:800;color:var(--verde-medio);">Aprobaciones</h1>
        <p class="text-muted">Propuestas pendientes de validación en los ciclos a tu cargo.</p>
      </div>

      <div id="banner" class="banner hidden"></div>

      <div class="table-responsive">
        <table class="table align-middle bg-white">
          <thead>
            <tr>
              <th>Título</th>
              <th>Líder</th>
              <th>Integrantes</th>
              <th>Ciclo</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tabla-propuestas"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="footer"></div>

  <!-- Modal de detalle + aprobar/rechazar -->
  <div class="modal fade" id="modal-detalle" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="detalle-titulo"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p><strong>Líder:</strong> <span id="detalle-lider"></span></p>
          <p><strong>Integrantes:</strong> <span id="detalle-integrantes"></span></p>
          <p><strong>Categorías:</strong> <span id="detalle-categorias"></span></p>
          <p><strong>Descripción:</strong> <span id="detalle-descripcion" style="white-space:pre-wrap;"></span></p>
          <p><strong>Problema:</strong> <span id="detalle-problema" style="white-space:pre-wrap;"></span></p>
          <p><strong>Justificación:</strong> <span id="detalle-justificacion" style="white-space:pre-wrap;"></span></p>
          <p><strong>Objetivos:</strong> <span id="detalle-objetivos" style="white-space:pre-wrap;"></span></p>
          <p><strong>Solución propuesta:</strong> <span id="detalle-solucion" style="white-space:pre-wrap;"></span></p>
          <p id="detalle-pdf-contenedor"></p>

          <div id="zona-rechazo" class="hidden mt-3">
            <label for="comentario-rechazo" class="form-label">Comentario (obligatorio para rechazar)</label>
            <textarea class="form-control" id="comentario-rechazo" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-primary" id="btn-mostrar-rechazo">Rechazar</button>
          <button type="button" class="btn btn-danger d-none" id="btn-confirmar-rechazo">Confirmar rechazo</button>
          <button type="button" class="btn btn-primary" id="btn-aprobar">Aprobar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="components/navbar.js"></script>
  <script src="components/sidebar.js"></script>
  <script src="components/footer.js"></script>
  <script src="js/aprobaciones.js"></script>
  <script>
    requerirCapacidad("encargado");
    renderizarBarraSuperior("topbar");
    renderizarBarraLateral("sidebar", "aprobaciones");
    renderizarPiePagina("footer");
    inicializarAprobaciones();
  </script>
</body>
</html>
