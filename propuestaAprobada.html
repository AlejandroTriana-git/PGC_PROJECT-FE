<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UDEC PGC — Propuestas aprobadas</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<link rel="icon" type="image/png" href="assets/logos/ESCUDO BLANCO.png">
</head>
<body>

  <div id="topbar"></div>

  <div class="app-shell">
    <div id="sidebar"></div>

    <main class="main-content">
      <div class="page-head mb-4">
        <h1 style="font-size:clamp(1.4rem,3vw,1.9rem);font-weight:800;color:var(--verde-medio);">Propuestas aprobadas</h1>
        <p class="text-muted">Registra tu PGC a partir de una propuesta ya aprobada.</p>
      </div>

      <div id="banner" class="banner hidden"></div>

      <div id="contenedor-propuesta-aprobada" style="max-width: 900px;"></div>
    </main>
  </div>

  <div id="footer"></div>

  <!-- Modal de confirmación de registro (Issue 2, HU-02) -->
  <div class="modal fade" id="modal-registro-pgc" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirmar registro de PGC</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="cuerpo-modal-registro"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="btn-confirmar-registro">Confirmar registro</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="components/navbar.js"></script>
  <script src="components/sidebar.js"></script>
  <script src="components/footer.js"></script>
  <script src="js/propuestaAprobada.js"></script>
  <script>
    requerirRol("estudiante");
    renderizarBarraSuperior("topbar");
    renderizarBarraLateral("sidebar", "propuestaAprobada");
    renderizarPiePagina("footer");
    inicializarPropuestaAprobada();
  </script>
</body>
</html>
