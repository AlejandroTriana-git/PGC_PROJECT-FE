<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UDEC PGC — Lineamientos</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<link rel="icon" type="image/png" href="assets/logos/ESCUDO BLANCO.png">
</head>
<body>

  <div id="topbar"></div>

  <div class="app-shell">
    <div id="sidebar"></div>

    <main class="main-content">
      <div class="page-head mb-4">
        <h1 style="font-size:clamp(1.4rem,3vw,1.9rem);font-weight:800;color:var(--verde-medio);">Lineamientos</h1>
        <p class="text-muted">Documentos vigentes del ciclo.</p>
      </div>

      <div id="banner" class="banner hidden"></div>

      <!-- Solo se llena si el rol es administrador; ver inicializarLineamientos -->
      <div id="contenedor-agregar" class="mb-3"></div>

      <div id="contenedor-lineamientos"></div>
    </main>
  </div>

  <div id="footer"></div>

  <!-- Modal de historial de versiones de un documento puntual -->
  <div class="modal fade" id="modal-historial" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="historial-titulo"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="cuerpo-historial"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="components/navbar.js"></script>
  <script src="components/sidebar.js"></script>
  <script src="components/footer.js"></script>
  <script src="js/lineamientos.js"></script>
  <script>
    requerirAutenticacion();
    renderizarBarraSuperior("topbar");
    renderizarBarraLateral("sidebar", "lineamientos");
    renderizarPiePagina("footer");
    inicializarLineamientos();
  </script>
</body>
</html>
