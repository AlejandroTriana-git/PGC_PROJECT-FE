<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UDEC PGC — Calificados</title>
<link rel="icon" type="image/png" href="assets/logos/ESCUDO BLANCO.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
</head>
<body>

  <div id="topbar"></div>

  <div class="app-shell">
    <div id="sidebar"></div>

    <main class="main-content">
      <div class="page-head mb-4">
        <h1 style="font-size:clamp(1.4rem,3vw,1.9rem);font-weight:800;color:var(--verde-medio);">Calificados</h1>
        <p class="text-muted">PGC que ya calificaste.</p>
      </div>

      <div id="banner" class="banner hidden"></div>

      <div class="table-responsive">
        <table class="table align-middle bg-white">
          <thead>
            <tr>
              <th scope="col">Título</th>
              <th scope="col">Líder</th>
              <th scope="col">Ciclo</th>
              <th scope="col">Nota</th>
              <th scope="col">Comentario</th>
            </tr>
          </thead>
          <tbody id="tabla-calificados"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="footer"></div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="components/navbar.js"></script>
  <script src="components/sidebar.js"></script>
  <script src="components/footer.js"></script>
  <script src="js/calificado.js"></script>
  <script>
    requerirCapacidad("jurado");
    renderizarBarraSuperior("topbar");
    renderizarBarraLateral("sidebar", "calificado");
    renderizarPiePagina("footer");
    inicializarCalificados();
  </script>
</body>
</html>
