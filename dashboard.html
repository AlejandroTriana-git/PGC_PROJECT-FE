<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UDEC PGC — Inicio</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- global.css trae la identidad UDEC + topbar/sidebar/footer ya
     estilizados: esta página NO define un solo color a mano. -->
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/dashboard.css">

<link rel="icon" type="image/png" href="assets/logos/ESCUDO BLANCO.png">


</head>
<body>

  <!-- Los tres bloques compartidos se inyectan por JS -->
  <div id="topbar"></div>

  <div class="app-shell">
    <div id="sidebar"></div>

    <main class="main-content">
      <!-- Saludo + subtítulo según el rol / contexto activo (dashboard.js) -->
      <div class="page-head mb-4">
        <h1 id="saludo">Bienvenido</h1>
        <p class="text-muted mb-0" id="subtitulo-panel"></p>
      </div>

      <!-- Tarjetas de resumen con datos reales según el rol (dashboard.js) -->
      <section class="mb-4" aria-labelledby="titulo-resumen">
        <h2 id="titulo-resumen" class="titulo-panel">Tu resumen</h2>
        <div id="contenedor-resumen" class="row g-3" aria-live="polite"></div>
      </section>

      <!-- NUEVO (Issue 12): pancarta con las etapas habilitadas o próximas -->
      <section class="mb-4" aria-labelledby="titulo-fechas">
        <h2 id="titulo-fechas" class="titulo-panel">Fechas importantes</h2>
        <div id="contenedor-pancarta"></div>
      </section>

      <!-- Accesos rápidos: las mismas opciones del menú, explicadas -->
      <section aria-labelledby="titulo-accesos">
        <h2 id="titulo-accesos" class="titulo-panel">Accesos rápidos</h2>
        <div id="contenedor-accesos" class="row g-3"></div>
      </section>
    </main>
  </div>

  <div id="footer"></div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="components/navbar.js"></script>
  <script src="components/sidebar.js"></script>
  <script src="components/footer.js"></script>
  <!-- NUEVO (Issue 12) -->
  <script src="components/pancartaFecha.js"></script>
  <script src="js/dashboard.js"></script>
  <script>
    // "Middleware" de rutas protegidas del lado del frontend (HU-01).
    requerirAutenticacion();

    renderizarBarraSuperior("topbar");
    renderizarBarraLateral("sidebar", "dashboard");
    renderizarPiePagina("footer");

    inicializarPanel();

    // NUEVO (Issue 12)
    renderizarPancartaFechas("contenedor-pancarta");
  </script>
</body>
</html>
