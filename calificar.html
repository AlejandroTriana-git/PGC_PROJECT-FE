<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UDEC PGC — Calificar</title>
<link rel="icon" type="image/png" href="assets/logos/ESCUDO BLANCO.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
</head>
<body>

  <div id="topbar"></div>

  <div class="app-shell">
    <div id="sidebar"></div>

    <main class="main-content">
      <div class="page-head mb-4">
        <h1 style="font-size:clamp(1.4rem,3vw,1.9rem);font-weight:800;color:var(--verde-medio);">Calificar</h1>
        <p class="text-muted">PGC pendientes por calificar en tus ciclos asignados como jurado.</p>
      </div>

      <div id="banner" class="banner hidden"></div>

      <div class="table-responsive">
        <table class="table align-middle bg-white">
          <thead>
            <tr>
              <th scope="col">Título</th>
              <th scope="col">Líder</th>
              <th scope="col">Ciclo</th>
              <th scope="col"><span class="visually-hidden">Acciones</span></th>
            </tr>
          </thead>
          <tbody id="tabla-calificar"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="footer"></div>

  <!-- Modal de calificación -->
  <div class="modal fade" id="modal-calificar" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="calificar-titulo"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">

          <div id="cuerpo-detalle-pgc">
            <p class="text-muted fst-italic">Cargando información del PGC...</p>
          </div>

          <hr>

          <div id="banner-modal-calificar" class="banner hidden"></div>

          <div class="row g-2">
            <div class="col-6 col-md-4">
              <label for="input-nota" class="form-label">Calificación (0.0 – 5.0)</label>
              <input type="number" class="form-control" id="input-nota" min="0" max="5" step="0.1">
            </div>
          </div>

          <div class="mt-3">
            <label for="input-comentario" class="form-label">Comentario / retroalimentación</label>
            <textarea class="form-control" id="input-comentario" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="btn-guardar-nota">Guardar calificación</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="components/navbar.js"></script>
  <script src="components/sidebar.js"></script>
  <script src="components/footer.js"></script>
  <script src="js/calificar.js"></script>
  <script>
    requerirCapacidad("jurado");
    renderizarBarraSuperior("topbar");
    renderizarBarraLateral("sidebar", "calificar");
    renderizarPiePagina("footer");
    inicializarCalificar();
  </script>
</body>
</html>
