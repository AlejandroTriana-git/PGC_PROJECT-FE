<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UDEC PGC — Ciclos</title>
<link rel="icon" type="image/png" href="assets/logos/ESCUDO BLANCO.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
</head>
<body>

  <div id="topbar"></div>

  <div class="app-shell">
    <div id="sidebar"></div>

    <main class="main-content">
      <div class="page-head mb-4">
        <h1 style="font-size:clamp(1.4rem,3vw,1.9rem);font-weight:800;color:var(--verde-medio);">Ciclos</h1>
        <p class="text-muted">Configura el máximo de integrantes, el encargado y los jurados de cada ciclo.</p>
      </div>

      <div id="banner" class="banner hidden"></div>

      <div class="table-responsive mb-4">
        <table class="table align-middle bg-white">
          <thead>
            <tr>
              <th>Ciclo</th>
              <th>Máx. integrantes</th>
              <th>Encargado</th>
              <th>Jurados</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tabla-ciclos"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="footer"></div>

  <!-- Modal de edición de ciclo -->
  <div class="modal fade" id="modal-ciclo" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="ciclo-titulo"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="input-max-integrantes" class="form-label">Máximo de integrantes</label>
            <input type="number" class="form-control" id="input-max-integrantes" min="1">
          </div>
          <div class="mb-3">
            <label for="select-encargado" class="form-label">Encargado del ciclo</label>
            <select class="form-select" id="select-encargado"></select>
          </div>
          <div class="mb-3">
            <label class="form-label">Jurados</label>
            <div id="lista-jurados" class="border rounded p-3"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-primary" id="btn-guardar-ciclo">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="components/navbar.js"></script>
  <script src="components/sidebar.js"></script>
  <script src="components/footer.js"></script>
  <script src="js/ciclos.js"></script>
  <script>
    requerirRol("coordinador");
    renderizarBarraSuperior("topbar");
    renderizarBarraLateral("sidebar", "ciclos");
    renderizarPiePagina("footer");
    inicializarCiclos();
  </script>
</body>
</html>
